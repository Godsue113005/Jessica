
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una flor para ti</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffffff, #f7f0ff, #eadfff);
    font-family: Georgia, serif;
    transition: opacity 1.2s ease, filter 1.2s ease;
}

body.leaving {
    opacity: 0;
    filter: blur(12px);
}

.scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
}

/* Flor */
.flower-container {
    position: relative;
    width: 260px;
    height: 390px;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: scale(.65);
    animation: appear 3s ease forwards;
}

@keyframes appear {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.flower {
    position: relative;
    width: 180px;
    height: 330px;
    animation: wind 4s ease-in-out infinite;
    transform-origin: bottom center;
}

@keyframes wind {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(3deg); }
}

.stem {
    position: absolute;
    width: 7px;
    height: 205px;
    background: linear-gradient(to right, #477d51, #83b77c, #477d51);
    left: 87px;
    top: 112px;
    border-radius: 50%;
    transform: rotate(2deg);
}

.leaf {
    position: absolute;
    width: 75px;
    height: 35px;
    background: linear-gradient(135deg, #a5ce9b, #477e55);
    border-radius: 100% 0 100% 0;
}

.leaf.left {
    top: 225px;
    left: 25px;
    transform: rotate(15deg);
    animation: leafLeft 4s ease-in-out infinite;
}

.leaf.right {
    top: 270px;
    left: 91px;
    transform: rotate(195deg);
    animation: leafRight 4s ease-in-out infinite;
}

@keyframes leafLeft {
    0%, 100% { transform: rotate(15deg); }
    50% { transform: rotate(24deg); }
}

@keyframes leafRight {
    0%, 100% { transform: rotate(195deg); }
    50% { transform: rotate(185deg); }
}

.bloom {
    position: absolute;
    width: 150px;
    height: 150px;
    top: 15px;
    left: 12px;
    animation: bloomWind 4s ease-in-out infinite;
    transform-origin: center bottom;
}

@keyframes bloomWind {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(3deg); }
}

.petal {
    position: absolute;
    width: 58px;
    height: 100px;
    left: 46px;
    top: 18px;
    background: linear-gradient(to bottom, #ffffff, #f4eaff, #d9c5f5);
    border-radius: 50% 50% 45% 45%;
    transform-origin: center bottom;
    box-shadow: 0 2px 12px rgba(170, 140, 210, .12);
}

.petal:nth-child(1) { transform: rotate(0deg) translateY(-24px); }
.petal:nth-child(2) { transform: rotate(60deg) translateY(-24px); }
.petal:nth-child(3) { transform: rotate(120deg) translateY(-24px); }
.petal:nth-child(4) { transform: rotate(180deg) translateY(-24px); }
.petal:nth-child(5) { transform: rotate(240deg) translateY(-24px); }
.petal:nth-child(6) { transform: rotate(300deg) translateY(-24px); }

.center {
    position: absolute;
    width: 25px;
    height: 25px;
    background: radial-gradient(circle, #b58ad8, #8053a9);
    border-radius: 50%;
    top: 80px;
    left: 62px;
    z-index: 3;
}

.stamen {
    position: absolute;
    width: 4px;
    height: 35px;
    background: #a77b42;
    border-radius: 5px;
    top: 50px;
    left: 74px;
    transform-origin: bottom;
    z-index: 4;
}

.stamen::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #d8ad55;
    border-radius: 50%;
    top: -5px;
    left: -2px;
}

.stamen:nth-child(2) { transform: rotate(-35deg); }
.stamen:nth-child(3) { transform: rotate(35deg); }
.stamen:nth-child(4) { transform: rotate(-65deg); }
.stamen:nth-child(5) { transform: rotate(65deg); }

/* Pétalos flotantes */
.falling-petal {
    position: fixed;
    width: 13px;
    height: 22px;
    background: linear-gradient(135deg, #fff, #d9c4f4);
    border-radius: 100% 0 100% 0;
    opacity: 0;
    pointer-events: none;
    animation: falling 7s linear infinite;
}

.falling-petal:nth-of-type(2) {
    left: 15%; top: 30%; animation-delay: 1s;
}
.falling-petal:nth-of-type(3) {
    left: 75%; top: 20%; animation-delay: 3s;
}
.falling-petal:nth-of-type(4) {
    left: 85%; top: 55%; animation-delay: 5s;
}
.falling-petal:nth-of-type(5) {
    left: 25%; top: 65%; animation-delay: 2s;
}

@keyframes falling {
    0% {
        opacity: 0;
        transform: translate(0, -20px) rotate(0deg);
    }
    15% { opacity: .8; }
    50% { transform: translate(45px, 100px) rotate(150deg); }
    85% { opacity: .6; }
    100% {
        opacity: 0;
        transform: translate(-20px, 220px) rotate(300deg);
    }
}

/* Botón delicado */
.button-wrapper {
    margin-top: -15px;
    opacity: 0;
    animation: buttonAppear 2s ease forwards;
    animation-delay: 2.8s;
    z-index: 5;
}

@keyframes buttonAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.next-button {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 13px 27px;
    color: #9275ad;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(174, 145, 205, .35);
    border-radius: 50px;
    box-shadow: 0 5px 20px rgba(157, 124, 190, .08);
    backdrop-filter: blur(8px);
    transition: all .5s ease;
}

.next-button:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, .9);
    border-color: #c5a9e5;
    box-shadow: 0 8px 25px rgba(157, 124, 190, .2);
    color: #79539b;
}

.button-flower {
    font-size: 15px;
    color: #b69acb;
    transition: transform .5s ease;
}

.next-button:hover .button-flower {
    transform: rotate(35deg) scale(1.2);
}

/* Pequeño brillo decorativo */
.next-button::before {
    content: "✧";
    position: absolute;
    top: -9px;
    right: 17px;
    color: #b99bd5;
    font-size: 14px;
    opacity: .8;
}

.next-button::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50px;
    background: linear-gradient(110deg, transparent, rgba(255,255,255,.7), transparent);
    transform: translateX(-120%);
    transition: transform .8s ease;
}

.next-button:hover::after {
    transform: translateX(120%);
}

@media (max-height: 600px) {
    .flower-container {
        transform: scale(.75);
        margin-top: -35px;
    }
    .button-wrapper {
        margin-top: -55px;
    }
}

/* Botón musical */
.music-control {
    position: fixed;
    bottom: 28px;
    right: 25px;
    z-index: 20;
    width: 45px;
    height: 45px;
    border: 1px solid rgba(174, 145, 205, .4);
    border-radius: 50%;
    background: rgba(255, 255, 255, .75);
    color: #9875b5;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(157, 124, 190, .12);
    backdrop-filter: blur(8px);
    transition: .3s ease;
}

.music-control:hover {
    transform: scale(1.1);
    background: white;
}

.music-control.playing {
    animation: musicPulse 2s ease-in-out infinite;
}

@keyframes musicPulse {
    50% {
        box-shadow: 0 4px 25px rgba(157,124,190,.4);
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="flower-container">
        <div class="flower">
            <div class="stem"></div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>

            <div class="bloom">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="center"></div>
                <div class="stamen"></div>
                <div class="stamen"></div>
                <div class="stamen"></div>
                <div class="stamen"></div>
            </div>
        </div>
    </div>

    <div class="button-wrapper">
        <a href="segunda.html" class="next-button" id="nextButton">
            <span class="button-flower">✿</span>
            <span> Descrubre mucho mas 🤍 </span>
            <span class="button-flower">✿</span>
        </a>
    </div>

</div>

<div class="falling-petal"></div>
<div class="falling-petal"></div>
<div class="falling-petal"></div>
<div class="falling-petal"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const music = document.getElementById("music");
    const button = document.getElementById("musicButton");
    const nextButton = document.getElementById("nextButton");

    if (!music || !button) {
        console.error("No se encontró el reproductor o el botón.");
        return;
    }

    music.volume = 0.35;

    button.addEventListener("click", async function () {

        console.log("Botón musical presionado");

        if (music.paused) {
            try {
                await music.play();

                button.textContent = "♫";
                button.classList.add("playing");

            } catch (error) {
                console.error("Error reproduciendo:", error);
                alert("No se pudo reproducir Violin.mp3. Revisa la ubicación del archivo.");
            }

        } else {
            music.pause();

            button.textContent = "♪";
            button.classList.remove("playing");
        }
    });

    if (nextButton) {
        nextButton.addEventListener("click", function(event) {
            event.preventDefault();

            sessionStorage.setItem("musicTime", music.currentTime);
            sessionStorage.setItem("musicPlaying", !music.paused);

            document.body.classList.add("leaving");

            setTimeout(() => {
                window.location.href = "segunda.html";
            }, 1200);
        });
    }

});
</script>
</script>

<audio id="music" loop preload="auto">
    <source src="./Violin.mp3" type="audio/mpeg">
</audio>

<button class="music-control" id="musicButton" type="button">
    ♫
</button>

</body>
</html>
